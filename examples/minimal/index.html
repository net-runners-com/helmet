<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noai, noimageai, noarchive" />
  <meta name="tdm-reservation" content="1" />
  <title>Helmet</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="loader"><p>Loading <span id="pct">0</span>%</p>
    <div id="gate" class="cf-turnstile" data-sitekey="__SITEKEY__" data-callback="onHelmetVerified" data-theme="dark"></div>
  </div>

  <header class="bar">
    <a class="brand" href="#top" data-t="nav.brand"></a>
    <nav><a href="#features" data-t="nav.a"></a><a href="#pricing" data-t="nav.b"></a></nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 class="title" data-t="hero.title"></h1>
      <p class="sub" data-t="hero.sub"></p>
      <img class="shot" alt="" />
    </section>

    <section id="features" class="features">
      <article class="card"><h3 data-t="f1.h"></h3><p data-t="f1.b"></p></article>
      <article class="card"><h3 data-t="f2.h"></h3><p data-t="f2.b"></p></article>
      <article class="card"><h3 data-t="f3.h"></h3><p data-t="f3.b"></p></article>
    </section>

    <section id="pricing" class="pricing">
      <div class="plan"><p class="plan-label" data-t="price.label"></p><p class="plan-value" data-t="price.value"></p>
        <a class="cta" href="#pricing" data-t="cta"></a></div>
    </section>
  </main>

  <footer class="foot"><p data-t="foot"></p></footer>
