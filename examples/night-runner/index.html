<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIGHT RUNNER</title>
  <meta name="description" content="A Helmet-protected demo site." />
  <meta name="robots" content="noai, noimageai, noarchive" />
  <meta name="tdm-reservation" content="1" />
  <meta name="copyright" content="(c) 2026 Night Runner. All rights reserved." />
</head>
<body>
  <div id="loader">
    <div class="loader-anim" id="loader-anim" aria-hidden="true"></div>
    <p class="loader-text">Inking the page… <span id="loader-pct">0</span>%</p>
    <div id="gate" class="cf-turnstile" data-sitekey="__SITEKEY__" data-callback="onHelmetVerified" data-theme="dark"></div>
  </div>

  <header class="bar">
    <a class="mark" href="#run" data-t="nav.mark"></a>
    <nav>
      <a href="#story" data-t="nav.story"></a>
      <a href="#cast" data-t="nav.cast"></a>
      <a class="pill" href="#read" data-magnetic data-t="nav.read"></a>
    </nav>
  </header>

  <main>
    <section id="run" aria-label="Issue one, page one">
      <div class="stage">
        <div class="page">
          <div class="panel panel-a" id="panel-a">
            <canvas aria-hidden="true"></canvas>
            <p class="caption" id="caption"></p>
            <p class="sfx" id="sfx" aria-hidden="true"></p>
            <span class="flash" aria-hidden="true"></span>
          </div>

          <div class="side">
            <div class="masthead">
              <p class="issue"><span data-t="issue.label"></span><x-t data-t="issue.no"></x-t></p>
              <h1 class="title" aria-label="Night Runner"><span class="t1" data-t="title.1"></span><span class="t2" data-t="title.2"></span></h1>
            </div>

            <div class="panel panel-b" id="panel-b">
              <canvas aria-hidden="true"></canvas>
              <p class="bubble" id="bubble"></p>
              <span class="flash" aria-hidden="true"></span>
            </div>

            <div class="row">
              <div class="panel panel-c" id="panel-c"><canvas aria-hidden="true"></canvas><span class="flash" aria-hidden="true"></span></div>
              <div class="dash">
                <p class="dash-label" data-t="dash.label"></p>
                <p class="dash-num"><span id="mph">62</span><small data-t="dash.unit"></small></p>
                <div class="dash-bar" aria-hidden="true"><i id="dash-fill"></i></div>
                <p class="dash-page"><x-t data-t="dash.page.a"></x-t> <span id="page-no">1</span> <x-t data-t="dash.page.b"></x-t></p>
              </div>
            </div>
          </div>
        </div>
        <div class="scroll-hint" id="scroll-hint" aria-hidden="true"></div>
      </div>
    </section>

    <section id="story">
      <p class="eyebrow" data-t="story.eyebrow"></p>
      <p class="statement" id="statement" data-t="story.statement"></p>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <section id="cast">
      <h2 class="head" data-t="cast.head"></h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="stats">
      <div class="stats" id="stats-grid"></div>
    </section>

    <footer id="read">
      <h2 class="cta"><x-t data-t="cta.1"></x-t><br /><x-t data-t="cta.2"></x-t></h2>
      <a class="burst-btn" href="#read" id="read-btn" data-magnetic data-t="read.btn"></a>
      <p class="read-note" id="read-note" role="status"></p>
      <div class="foot">
        <p data-t="foot.1"></p>
        <p data-t="foot.2"></p>
      </div>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
